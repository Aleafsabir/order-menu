<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tap to Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Client-side QR Generator CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-28">

  <!-- Header with Brand & Share Action -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-xs">
    <div>
      <h1 id="brand-name" class="font-extrabold text-base tracking-tight text-slate-900">Loading...</h1>
      <p class="text-[11px] text-emerald-600 font-bold flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Instant WhatsApp Ordering
      </p>
    </div>
    <div class="flex items-center gap-2">
      <!-- QR / Share Trigger Button -->
      <button onclick="openShareModal()" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-xl transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
        <span>QR</span>
      </button>
      <div id="currency-badge" class="text-[11px] font-bold bg-slate-100 text-slate-600 px-2 py-1.5 rounded-xl">MVR</div>
    </div>
  </header>

  <!-- Category Filter Bar -->
  <nav id="category-bar" class="bg-white border-b border-slate-100 px-4 py-2 flex gap-2 overflow-x-auto no-scrollbar sticky top-[57px] z-20"></nav>

  <!-- Items Feed -->
  <main id="menu-feed" class="max-w-md mx-auto px-4 py-3 space-y-2.5">
    <div class="text-center py-12 text-slate-400 text-xs font-semibold" id="loader">Loading menu...</div>
  </main>

  <!-- Sticky Bottom Cart Bar -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 p-3 bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 transition-transform duration-200 translate-y-full">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-[11px] text-slate-500 font-medium" id="cart-count">0 items</p>
        <p class="text-base font-black text-slate-900" id="cart-total">MVR 0.00</p>
      </div>
      <button onclick="openModal()" class="bg-emerald-600 active:scale-95 text-white font-extrabold text-xs px-5 py-3 rounded-xl shadow-md shadow-emerald-600/20">
        Review Order →
      </button>
    </div>
  </div>

  <!-- QR & Table Share Modal -->
  <div id="share-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex flex-col justify-end">
    <div class="bg-white rounded-t-3xl max-w-md mx-auto w-full p-5 space-y-4 shadow-2xl animate-in slide-in-from-bottom duration-200">
      <div class="flex justify-between items-center border-b pb-3">
        <div>
          <h2 class="font-extrabold text-sm text-slate-900">Scan or Share Menu</h2>
          <p class="text-[11px] text-slate-500">Print for tables or share on WhatsApp/Viber</p>
        </div>
        <button onclick="closeShareModal()" class="w-7 h-7 rounded-full bg-slate-200 text-xs font-bold text-slate-600">✕</button>
      </div>

      <!-- Generated QR Box -->
      <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-2xl border border-slate-100">
        <div id="qrcode" class="p-2 bg-white rounded-xl shadow-xs"></div>
        <p class="text-[11px] text-slate-500 font-medium mt-3 text-center">Customers scan this to open your menu instantly without typing.</p>
      </div>

      <!-- Action Buttons -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="copyMenuLink()" id="copy-btn" class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-800 font-bold text-xs py-3 rounded-xl flex items-center justify-center gap-1.5 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
          <span id="copy-text">Copy Link</span>
        </button>
        <button onclick="triggerNativeShare()" class="bg-slate-900 active:scale-95 text-white font-bold text-xs py-3 rounded-xl flex items-center justify-center gap-1.5 shadow-md transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
          <span>Share...</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Checkout Drawer -->
  <div id="checkout-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex flex-col justify-end">
    <div class="bg-white rounded-t-3xl max-w-md mx-auto w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b flex justify-between items-center bg-slate-50">
        <h2 class="font-extrabold text-sm text-slate-900">Your Order Summary</h2>
        <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-slate-200 text-xs font-bold text-slate-600">✕</button>
      </div>

      <div class="p-4 overflow-y-auto space-y-3.5 text-xs">
        <div id="modal-items-list" class="space-y-1.5 bg-slate-50 p-3 rounded-xl border border-slate-100"></div>

        <div class="grid grid-cols-2 gap-2">
          <label class="border rounded-xl p-2 flex items-center gap-1.5 cursor-pointer has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50">
            <input type="radio" name="orderType" value="Delivery" checked class="accent-emerald-600">
            <span class="font-bold text-slate-800">🛵 Delivery</span>
          </label>
          <label class="border rounded-xl p-2 flex items-center gap-1.5 cursor-pointer has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50">
            <input type="radio" name="orderType" value="Takeaway" class="accent-emerald-600">
            <span class="font-bold text-slate-800">🛍️ Takeaway</span>
          </label>
        </div>

        <div class="space-y-2">
          <input type="text" id="cust-name" placeholder="Your Name" class="w-full px-3 py-2 border rounded-xl bg-slate-50 focus:bg-white focus:outline-emerald-600">
          <input type="tel" id="cust-phone" placeholder="Phone Number (e.g. 7991234)" class="w-full px-3 py-2 border rounded-xl bg-slate-50 focus:bg-white focus:outline-emerald-600">
          <input type="text" id="cust-address" placeholder="Delivery Address / Flat / Floor" class="w-full px-3 py-2 border rounded-xl bg-slate-50 focus:bg-white focus:outline-emerald-600">
          <input type="text" id="cust-note" placeholder="Special Instructions (optional)" class="w-full px-3 py-2 border rounded-xl bg-slate-50 focus:bg-white focus:outline-emerald-600">
        </div>
      </div>

      <div class="p-3 border-t bg-slate-50">
        <button onclick="sendOrder()" class="w-full bg-emerald-600 active:scale-98 text-white font-black text-xs py-3.5 rounded-xl shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-2">
          Send to Kitchen on WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tenantName = urlParams.get('name') || 'Island Bites Cafe';
    const rawPhone = urlParams.get('wa') || '9607999999';
    const targetPhone = rawPhone.replace(/[^0-9]/g, '');
    const sheetId = urlParams.get('sheet');
    const currency = urlParams.get('cur') || 'MVR';

    document.getElementById('brand-name').innerText = tenantName;
    document.getElementById('currency-badge').innerText = currency;

    let menu = [];
    let cart = {};
    let qrInstance = null;

    async function loadData() {
      if (sheetId) {
        try {
          const endpoint = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
          const res = await fetch(endpoint);
          const rawText = await res.text();
          const jsonText = rawText.substring(rawText.indexOf('{'), rawText.lastIndexOf('}') + 1);
          const data = JSON.parse(jsonText);
          
          menu = data.table.rows.map((row, idx) => {
            const c = row.c;
            return {
              id: idx + 1,
              name: c[0]?.v ? String(c[0].v).trim() : 'Item',
              category: c[1]?.v ? String(c[1].v).trim() : 'General',
              price: Number(c[2]?.v) || 0,
              desc: c[3]?.v ? String(c[3].v).trim() : '',
              tag: c[4]?.v ? String(c[4].v).trim() : null,
              available: c[5]?.v !== false && String(c[5]?.v).toLowerCase() !== 'no'
            };
          }).filter(item => item.available && item.name && item.price > 0);
        } catch (e) {
          loadDemoData();
        }
      } else {
        loadDemoData();
      }
      initCategories();
      renderItems('all');
    }

    function loadDemoData() {
      menu = [
        { id: 1, name: "Spicy Tuna Submarine", category: "Subs", price: 85, desc: "Fresh yellowfin tuna, house hot chili sauce, toasted sub roll", tag: "Popular" },
        { id: 2, name: "Crispy Chicken Burger", category: "Burgers", price: 95, desc: "Crumbed fillet, melted cheddar, garlic mayo, brioche", tag: "Bestseller" },
        { id: 3, name: "Loaded Beef Fries", category: "Snacks", price: 75, desc: "Crispy fries topped with seasoned beef & cheddar sauce", tag: null },
        { id: 4, name: "Iced Spanish Latte", category: "Drinks", price: 55, desc: "Double shot espresso, sweet condensed milk, served chilled", tag: "Favorite" },
        { id: 5, name: "Passion Fruit Mojito", category: "Drinks", price: 50, desc: "Fresh island passion fruit, crushed mint, sparkling soda", tag: null }
      ];
    }

    function initCategories() {
      const categories = ['all', ...new Set(menu.map(i => i.category))];
      const nav = document.getElementById('category-bar');
      nav.innerHTML = categories.map(cat => `
        <button onclick="renderItems('${cat}', this)" class="cat-pill px-3 py-1.5 rounded-full text-[11px] font-bold whitespace-nowrap ${cat === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">
          ${cat === 'all' ? 'All Items' : cat}
        </button>
      `).join('');
    }

    function renderItems(selectedCategory, btn) {
      if (btn) {
        document.querySelectorAll('.cat-pill').forEach(p => p.className = "cat-pill px-3 py-1.5 rounded-full text-[11px] font-bold whitespace-nowrap bg-slate-100 text-slate-600");
        btn.className = "cat-pill px-3 py-1.5 rounded-full text-[11px] font-bold whitespace-nowrap bg-slate-900 text-white";
      }
      const feed = document.getElementById('menu-feed');
      const filtered = selectedCategory === 'all' ? menu : menu.filter(i => i.category === selectedCategory);

      feed.innerHTML = filtered.map(item => `
        <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-xs flex justify-between items-center gap-2">
          <div class="flex-1">
            ${item.tag ? `<span class="inline-block text-[9px] font-black uppercase px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-200/50 mb-1">${item.tag}</span>` : ''}
            <h3 class="font-bold text-xs text-slate-900">${item.name}</h3>
            ${item.desc ? `<p class="text-[11px] text-slate-400 mt-0.5 line-clamp-1">${item.desc}</p>` : ''}
            <p class="text-xs font-black text-slate-900 mt-1">${currency} ${item.price.toFixed(2)}</p>
          </div>
          <div class="flex items-center">
            ${cart[item.id] ? `
              <div class="flex items-center bg-slate-900 text-white rounded-xl overflow-hidden shadow-xs">
                <button onclick="qty(${item.id}, -1)" class="w-7 h-7 flex items-center justify-center font-bold text-xs active:bg-slate-800">-</button>
                <span class="w-5 text-center text-xs font-bold">${cart[item.id]}</span>
                <button onclick="qty(${item.id}, 1)" class="w-7 h-7 flex items-center justify-center font-bold text-xs active:bg-slate-800">+</button>
              </div>
            ` : `
              <button onclick="qty(${item.id}, 1)" class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-extrabold px-3 py-1.5 rounded-xl active:scale-95">
                + Add
              </button>
            `}
          </div>
        </div>
      `).join('');
    }

    function qty(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      updateCart();
      const activeText = document.querySelector('.cat-pill.bg-slate-900').innerText;
      renderItems(activeText === 'All Items' ? 'all' : activeText);
    }

    function updateCart() {
      const count = Object.values(cart).reduce((a, b) => a + b, 0);
      const total = Object.entries(cart).reduce((sum, [id, q]) => {
        const itm = menu.find(i => i.id == id);
        return sum + (itm ? itm.price * q : 0);
      }, 0);

      const bar = document.getElementById('cart-bar');
      if (count > 0) {
        bar.classList.remove('translate-y-full');
        document.getElementById('cart-count').innerText = `${count} item${count > 1 ? 's' : ''}`;
        document.getElementById('cart-total').innerText = `${currency} ${total.toFixed(2)}`;
      } else {
        bar.classList.add('translate-y-full');
      }
    }

    function openModal() {
      let total = 0;
      document.getElementById('modal-items-list').innerHTML = Object.entries(cart).map(([id, q]) => {
        const item = menu.find(i => i.id == id);
        const sub = item.price * q;
        total += sub;
        return `<div class="flex justify-between font-medium text-slate-800"><span>${q}x ${item.name}</span><span class="font-bold">${currency} ${sub.toFixed(2)}</span></div>`;
      }).join('') + `<div class="border-t border-slate-200 pt-1.5 mt-1.5 flex justify-between font-extrabold text-slate-900"><span>Total</span><span>${currency} ${total.toFixed(2)}</span></div>`;
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    // QR & Share Modal Functions
    function openShareModal() {
      const currentUrl = window.location.href;
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = ''; // Clear previous

      qrInstance = new QRCode(qrContainer, {
        text: currentUrl,
        width: 160,
        height: 160,
        colorDark : "#0f172a",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.M
      });

      document.getElementById('share-modal').classList.remove('hidden');
    }

    function closeShareModal() {
      document.getElementById('share-modal').classList.add('hidden');
    }

    function copyMenuLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const text = document.getElementById('copy-text');
        text.innerText = "Copied!";
        setTimeout(() => { text.innerText = "Copy Link"; }, 2000);
      });
    }

    function triggerNativeShare() {
      if (navigator.share) {
        navigator.share({
          title: tenantName,
          text: `Order direct from ${tenantName} on WhatsApp:`,
          url: window.location.href
        }).catch(() => {});
      } else {
        copyMenuLink();
      }
    }

    function sendOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const type = document.querySelector('input[name="orderType"]:checked').value;
      const addr = document.getElementById('cust-address').value.trim();
      const note = document.getElementById('cust-note').value.trim();

      if (!name || !phone) return alert('Please enter your name and phone number.');
      if (type === 'Delivery' && !addr) return alert('Please enter your delivery address.');

      let total = 0;
      let itemsText = '';
      Object.entries(cart).forEach(([id, q]) => {
        const itm = menu.find(i => i.id == id);
        const sub = itm.price * q;
        total += sub;
        itemsText += `• ${q}x ${itm.name} (${currency} ${sub})\n`;
      });

      let text = `*NEW ORDER - ${tenantName.toUpperCase()}*\n`;
      text += `---------------------------\n`;
      text += `*Customer:* ${name} (${phone})\n`;
      text += `*Type:* ${type}\n`;
      if (type === 'Delivery') text += `*Address:* ${addr}\n`;
      if (note) text += `*Notes:* ${note}\n`;
      text += `---------------------------\n`;
      text += itemsText;
      text += `---------------------------\n`;
      text += `*TOTAL: ${currency} ${total.toFixed(2)}*`;

      window.location.href = `https://wa.me/${targetPhone}?text=${encodeURIComponent(text)}`;
    }

    loadData();
  </script>
</body>
</html>
